<div id="screen-compete" class="screen">
  <div class="compete-main">
    <div class="compete-timer-box">
      <div class="compete-timer" id="compete-timer">60</div>
      <div class="compete-timer-label">SECONDS REMAINING</div>
    </div>

    <!-- Side-by-Side Video Streams View -->
    <div class="video-grid" style="display: flex; gap: 12px; width: 100%; margin: 12px 0;">
      <!-- Local Player Stream -->
      <div class="video-container" style="flex: 1; position: relative; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 4/3;">
        <video id="compete-your-video" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
        <div class="video-label" style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px;">You</div>
      </div>
      
      <!-- Opponent Player Stream -->
      <div class="video-container" style="flex: 1; position: relative; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 4/3;">
        <video id="compete-opp-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <div id="compete-opp-placeholder" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-size: 13px;">
          Waiting for opponent video...
        </div>
        <div class="video-label" style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px;" id="compete-opp-name">Opponent</div>
      </div>
    </div>

    <div class="compete-vs-bar">
      <div class="compete-side">
        <div class="compete-side-name" id="compete-your-name">You</div>
        <div class="compete-side-reps" id="compete-your-reps">0</div>
      </div>
      <div class="compete-vs-divider">VS</div>
      <div class="compete-side">
        <div class="compete-side-name" id="compete-opp-name">Opponent</div>
        <div class="compete-side-reps" id="compete-opp-reps">0</div>
      </div>
    </div>

    <div class="compete-progress">
      <div class="compete-progress-track">
        <div class="compete-progress-you" id="compete-progress-you" style="width: 50%;"></div>
        <div class="compete-progress-opp" id="compete-progress-opp" style="width: 50%;"></div>
      </div>
    </div>

    <div class="compete-phase-display" id="compete-phase-display">GO!</div>

    <button class="btn btn-secondary" id="btn-forfeit" style="max-width: 200px;">Forfeit Match</button>
  </div>
</div>
